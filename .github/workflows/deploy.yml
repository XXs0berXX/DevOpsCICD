# NestMarket CI/CD
#
#   git push -> 1. unit tests -> 2. build zip -> upload to S3 -> 3. deploy latest build from S3 -> 4. verify production
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), printed by infra/aws_setup.py:
#   AWS_REGION, AWS_ROLE_ARN, ARTIFACT_BUCKET, WEBSITE_BUCKET, EC2_INSTANCE_ID, API_URL, WEBSITE_URL
# No AWS keys are stored in GitHub: the workflow logs in with OIDC and assumes AWS_ROLE_ARN.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:          # PRs only run the unit tests
  workflow_dispatch:     # manual "Run workflow" button

permissions:
  id-token: write        # required for OIDC login to AWS
  contents: read

concurrency:             # never run two deployments at the same time
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    name: 1. Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests (pipeline stops here if any test fails)
        run: pytest api/tests worker/tests -v

  build:
    name: 2. Build & upload artifact to S3
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.pkg.outputs.artifact }}
    steps:
      - uses: actions/checkout@v5
      - name: Package build-v${{ env.VERSION }}.zip
        id: pkg
        run: |
          echo "$VERSION" > api/VERSION
          printf 'window.API_BASE = "%s";\nwindow.APP_VERSION = "%s";\n' "${{ vars.API_URL }}" "$VERSION" > frontend/config.js
          mkdir dist
          zip -r "dist/build-v$VERSION.zip" api worker frontend deploy docker-compose.yml -x '*/tests/*' '*__pycache__*'
          unzip -l "dist/build-v$VERSION.zip"
          echo "artifact=build-v$VERSION.zip" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - name: Upload to S3 (versioned build + latest pointer)
        run: |
          B=s3://${{ vars.ARTIFACT_BUCKET }}/builds
          aws s3 cp "dist/build-v$VERSION.zip" "$B/build-v$VERSION.zip"
          aws s3 cp "$B/build-v$VERSION.zip" "$B/latest.zip"
          aws s3 ls "$B/"

  deploy:
    name: 3. Deploy latest build from S3
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.WEBSITE_URL }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - name: Download latest build from S3
        run: |
          aws s3 cp s3://${{ vars.ARTIFACT_BUCKET }}/builds/latest.zip latest.zip
          unzip -q latest.zip -d build
          echo "Deploying version $(cat build/api/VERSION)"
      - name: Frontend -> S3 static website
        run: aws s3 sync build/frontend s3://${{ vars.WEBSITE_BUCKET }} --delete --cache-control no-cache
      - name: Backend -> EC2 (pull latest build from S3 and restart containers, via SSM)
        run: |
          jq -n --arg b "${{ vars.ARTIFACT_BUCKET }}" '{commands: [
            "set -e",
            "aws s3 cp s3://\($b)/builds/latest.zip /tmp/latest.zip",
            "rm -rf /opt/nestmarket/release && mkdir -p /opt/nestmarket/release",
            "unzip -q /tmp/latest.zip -d /opt/nestmarket/release",
            "bash /opt/nestmarket/release/deploy/ec2_deploy.sh"]}' > params.json
          CMD_ID=$(aws ssm send-command --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript --comment "Deploy v$VERSION" \
            --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command $CMD_ID"
          for i in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]

  verify:
    name: 4. Verify production
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: API on EC2 reports the new version
        run: |
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "${{ vars.API_URL }}/api/health" | jq -r .version) && [ "$LIVE" = "$VERSION" ] && break
            sleep 5
          done
          echo "Live API version: $LIVE (expected $VERSION)"
          [ "$LIVE" = "$VERSION" ]
          curl -fsS "${{ vars.API_URL }}/api/listings" > /dev/null
      - name: Website on S3 serves the new build
        run: |
          curl -fsS "${{ vars.WEBSITE_URL }}/config.js" | tee /dev/stderr | grep -q "\"$VERSION\""
          curl -fsS "${{ vars.WEBSITE_URL }}/index.html" > /dev/null
          echo "Production is live: ${{ vars.WEBSITE_URL }}"
